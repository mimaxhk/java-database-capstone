<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Doctor Dashboard</title>
    <link rel="icon" type="image/png" href="/assets/images/logo/logo.png" />
    <link rel="stylesheet" href="/assets/css/adminDashboard.css">
    <link rel="stylesheet" href="/assets/css/doctorDashboard.css">
    <link rel="stylesheet" href="/assets/css/style.css">
    <script src="/js/render.js" defer></script>
    <script src="/js/util.js" defer></script>
    <script src="/js/components/header.js" defer></script>
    <script src="/js/components/footer.js" defer></script>
    <script src="/js/components/patientRows.js" defer></script>
    <script src="/js/services/patientServices.js" defer></script>
    <script src="/js/doctorDashboard.js" defer></script>
</head>
<body>
    <div class="container">
        <div class="wrapper">
            <div id="header"></div>
            <main class="main-content">
                <input type="text" id="searchBar" class="searchBar" placeholder="Search patients" />
                <div class="filter-section">
                    <button id="todayButton">Today's Appointments</button>
                    <input type="date" id="datePicker" />
                </div>
                <table id="patientTable">
                    <thead>
                        <tr>
                            <th>Patient ID</th>
                            <th>Name</th>
                            <th>Phone</th>
                            <th>Email</th>
                            <th>Prescription</th>
                        </tr>
                    </thead>
                    <tbody id="patientTableBody">
                        <!-- Patient records will be dynamically inserted here -->
                    </tbody>
                </table>
            </main>
            <div id="footer"></div>
        </div>
    </div>
</body>
</html>
